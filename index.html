<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رسم ذكي بالذكاء الاصطناعي</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

    :root {
      --bg: #0D0F12;
      --ink: #E8E6E1;
      --ink-dim: #8B9096;
      --line: rgba(255, 255, 255, 0.1);
      --panel: rgba(20, 24, 30, 0.65);
      --amber: #FFB020;
      --teal: #5EEAD4;
      --radius: 12px;
      font-family: 'Cairo', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      user-select: none;
    }

    #stage { position: relative; width: 100%; height: 100%; background: #000; }
    #webcam { display: none; }

    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #drawCanvas { z-index: 2; }
    #cursorCanvas { z-index: 3; }

    /* ---------- واجهة المستخدم ---------- */
    .glass-panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .hud-top {
      position: absolute; top: 20px; left: 20px; right: 20px;
      z-index: 5; display: flex; align-items: center; justify-content: space-between;
      pointer-events: none;
    }

    .status-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; font-size: 14px; font-weight: 600;
    }

    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--ink-dim); transition: 0.3s;
    }
    .status-dot.ready { background: var(--teal); box-shadow: 0 0 10px var(--teal); }
    .status-dot.tracking { background: var(--amber); box-shadow: 0 0 10px var(--amber); }

    /* ---------- شريط الأدوات ---------- */
    .toolbar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 5; display: flex; align-items: center; gap: 15px;
      padding: 12px 20px; flex-wrap: wrap; justify-content: center; width: 90%; max-width: 900px;
    }

    .tool-group { display: flex; align-items: center; gap: 8px; }
    .divider { width: 1px; height: 30px; background: var(--line); margin: 0 5px; }

    .btn {
      font-family: inherit; font-size: 14px; font-weight: 600;
      padding: 8px 16px; border-radius: 8px;
      border: 1px solid transparent; background: rgba(255,255,255,0.05);
      color: var(--ink); cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn.active { background: var(--amber); color: #000; box-shadow: 0 0 12px rgba(255, 176, 32, 0.4); }
    
    select.btn { appearance: none; padding-right: 30px; outline: none; }
    
    .swatch {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid transparent; background: var(--c);
      cursor: pointer; transition: 0.2s;
    }
    .swatch.active { border-color: #fff; transform: scale(1.2); box-shadow: 0 0 10px var(--c); }

    input[type=range] { width: 100px; accent-color: var(--amber); cursor: pointer; }

    /* ---------- شاشة التحميل ---------- */
    #loadingOverlay {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
      background: var(--bg); transition: 0.5s;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    
    .loader-spinner {
      width: 50px; height: 50px;
      border: 4px solid var(--line); border-top-color: var(--amber);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="stage">
  <video id="webcam" autoplay playsinline></video>
  <canvas id="cameraCanvas"></canvas>
  <canvas id="drawCanvas"></canvas>
  <canvas id="cursorCanvas"></canvas>

  <div class="hud-top">
    <div class="status-pill glass-panel">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">جاري التحميل...</span>
    </div>
    <div class="status-pill glass-panel" id="handsCount">اليدين: 0</div>
  </div>

  <div class="toolbar glass-panel">
    <!-- أدوات الرسم -->
    <div class="tool-group">
      <button class="btn active" data-tool="free">✏️ حر</button>
      <button class="btn" data-tool="square">⬛ مربع</button>
      <button class="btn" data-tool="circle">🔵 دائرة</button>
      <button class="btn" data-tool="triangle">🔺 مثلث</button>
    </div>

    <div class="divider"></div>

    <!-- نمط الرسم -->
    <div class="tool-group">
      <select id="styleSelect" class="btn">
        <option value="solid">عادي (تعبئة)</option>
        <option value="xray">أشعة X-Ray (مفرغ)</option>
        <option value="neon">نيون (مضيء)</option>
      </select>
    </div>

    <div class="divider"></div>

    <!-- الألوان -->
    <div class="tool-group">
      <button class="swatch active" style="--c: #FFB020" data-color="#FFB020"></button>
      <button class="swatch" style="--c: #5EEAD4" data-color="#5EEAD4"></button>
      <button class="swatch" style="--c: #F43F5E" data-color="#F43F5E"></button>
      <button class="swatch" style="--c: #A855F7" data-color="#A855F7"></button>
      <button class="swatch" style="--c: #FFFFFF" data-color="#FFFFFF"></button>
    </div>

    <div class="divider"></div>

    <!-- الحجم والمسح -->
    <div class="tool-group">
      <input type="range" id="brushSize" min="2" max="40" value="10">
      <button class="btn" id="clearBtn" style="color: #F43F5E;">🗑️ مسح الكل</button>
    </div>
  </div>

  <div id="loadingOverlay">
    <div class="loader-spinner"></div>
    <h3 id="loaderText">جاري تشغيل الذكاء الاصطناعي...</h3>
  </div>
</div>

<script type="module">
  import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

  const video = document.getElementById("webcam");
  const cameraCanvas = document.getElementById("cameraCanvas");
  const drawCanvas = document.getElementById("drawCanvas");
  const cursorCanvas = document.getElementById("cursorCanvas");

  const cameraCtx = cameraCanvas.getContext("2d");
  const drawCtx = drawCanvas.getContext("2d");
  const cursorCtx = cursorCanvas.getContext("2d");

  // المتغيرات والحالة
  let activeColor = "#FFB020";
  let activeSize = 10;
  let currentTool = "free"; 
  let currentStyle = "solid";
  let handLandmarker = null;
  let lastClapTime = 0;

  // حالة كل يد لرسم الأشكال
  const handState = [
    { isDrawing: false, startX: null, startY: null, lastX: null, lastY: null },
    { isDrawing: false, startX: null, startY: null, lastX: null, lastY: null }
  ];

  // إعدادات واجهة المستخدم
  document.querySelectorAll('.swatch').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeColor = btn.dataset.color;
    });
  });

  document.querySelectorAll('[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTool = btn.dataset.tool;
    });
  });

  document.getElementById('styleSelect').addEventListener('change', (e) => {
    currentStyle = e.target.value;
  });

  document.getElementById('brushSize').addEventListener('input', (e) => {
    activeSize = Number(e.target.value);
  });

  document.getElementById('clearBtn').addEventListener('click', clearCanvas);

  function clearCanvas() {
    drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  }

  function setStatus(text, mode) {
    document.getElementById("statusText").textContent = text;
    document.getElementById("statusDot").className = "status-dot" + (mode ? ` ${mode}` : "");
  }

  // إعداد الكاميرا
  async function setupCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: "user" }});
    video.srcObject = stream;
    return new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(video); }; });
  }

  function resizeCanvases() {
    const w = video.videoWidth; const h = video.videoHeight;
    [cameraCanvas, drawCanvas, cursorCanvas].forEach(c => { c.width = w; c.height = h; });
  }
  window.addEventListener("resize", () => { if (video.videoWidth) resizeCanvases(); });

  // إعداد نموذج الذكاء الاصطناعي
  async function init() {
    await setupCamera();
    resizeCanvases();
    
    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
      runningMode: "VIDEO",
      numHands: 2, // تم تفعيل اليدين
      minHandDetectionConfidence: 0.6,
      minHandPresenceConfidence: 0.6,
      minTrackingConfidence: 0.6,
    });

    document.getElementById("loadingOverlay").classList.add("hidden");
    setStatus("جاهز! ارفع إصبعك للرسم، وصفق للمسح", "ready");
    runFrame();
  }

  // دوال الرسم الهندسية
  function toScreen(lm) { return { x: (1 - lm.x) * cursorCanvas.width, y: lm.y * cursorCanvas.height }; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  // هل السبابة فقط مرفوعة؟ (الرسم بإصبع واحد)
  function isIndexPointing(lm) {
    // حساب مسافة أطراف الأصابع عن المعصم
    const wrist = lm[0];
    const indexDist = dist(wrist, lm[8]);
    const middleDist = dist(wrist, lm[12]);
    const ringDist = dist(wrist, lm[16]);
    
    // يعتبر السبابة مرفوعاً إذا كانت مسافته أطول بكثير من الإصبع الأوسط والبنصر
    return indexDist > middleDist * 1.3 && indexDist > ringDist * 1.3;
  }

  // دالة رسم الأشكال بالأنماط المختلفة
  function renderShape(ctx, tool, style, start, end, color, size, isPreview) {
    ctx.beginPath();
    const w = end.x - start.x;
    const h = end.y - start.y;
    
    if (tool === 'square') {
      ctx.rect(start.x, start.y, w, h);
    } else if (tool === 'circle') {
      const radius = Math.hypot(w, h) / 2;
      ctx.arc(start.x + w/2, start.y + h/2, radius, 0, Math.PI * 2);
    } else if (tool === 'triangle') {
      ctx.moveTo(start.x + w/2, start.y);
      ctx.lineTo(start.x + w, start.y + h);
      ctx.lineTo(start.x, start.y + h);
      ctx.closePath();
    }

    // تطبيق النمط (Style)
    ctx.shadowBlur = 0;
    if (style === 'solid') {
      ctx.fillStyle = isPreview ? color + '80' : color; // شفافية للمعاينة
      ctx.fill();
    } else if (style === 'xray') {
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.setLineDash(isPreview ? [10, 10] : []); // داش أثناء المعاينة
      ctx.stroke();
      ctx.setLineDash([]);
      
      // تأثير داخلي لـ X-Ray (اختياري)
      if (!isPreview && tool === 'square') {
         ctx.beginPath();
         ctx.moveTo(start.x, start.y); ctx.lineTo(start.x + w, start.y + h);
         ctx.moveTo(start.x + w, start.y); ctx.lineTo(start.x, start.y + h);
         ctx.lineWidth = size / 2; ctx.stroke();
      }
    } else if (style === 'neon') {
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.shadowColor = color;
      ctx.shadowBlur = 20;
      ctx.stroke();
      ctx.shadowBlur = 0; // إعادة تعيين
    }
  }

  // الحلقة الرئيسية (Frame Loop)
  function runFrame() {
    // رسم الكاميرا وتعتيمها
    cameraCtx.save();
    cameraCtx.translate(cameraCanvas.width, 0);
    cameraCtx.scale(-1, 1);
    cameraCtx.drawImage(video, 0, 0, cameraCanvas.width, cameraCanvas.height);
    cameraCtx.restore();
    cameraCtx.fillStyle = "rgba(13, 15, 18, 0.6)";
    cameraCtx.fillRect(0, 0, cameraCanvas.width, cameraCanvas.height);

    const results = handLandmarker.detectForVideo(video, performance.now());
    cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
    document.getElementById("handsCount").textContent = `اليدين: ${results.landmarks.length}`;

    // الكشف عن التصفيق (Clapping) إذا كان هناك يدين
    if (results.landmarks.length === 2) {
      const wrist1 = toScreen(results.landmarks[0][0]);
      const wrist2 = toScreen(results.landmarks[1][0]);
      const handsDistance = dist(wrist1, wrist2);
      
      // إذا تقاربت اليدان (المسافة أقل من 150 بكسل تقريباً)
      if (handsDistance < 150 && performance.now() - lastClapTime > 2000) {
        clearCanvas();
        setStatus("👏 تم التصفيق! مُسحت اللوحة", "tracking");
        lastClapTime = performance.now();
        // تأثير وميض أبيض عند التصفيق
        cursorCtx.fillStyle = "rgba(255,255,255,0.8)";
        cursorCtx.fillRect(0,0,cursorCanvas.width, cursorCanvas.height);
      }
    }

    // معالجة الرسم لكل يد
    results.landmarks.forEach((lm, index) => {
      const state = handState[index];
      if(!state) return;

      const pointing = isIndexPointing(lm);
      const tip = toScreen(lm[8]); // طرف السبابة

      // رسم مؤشر الإصبع
      cursorCtx.beginPath();
      cursorCtx.arc(tip.x, tip.y, pointing ? activeSize/2 + 4 : 8, 0, Math.PI * 2);
      cursorCtx.fillStyle = pointing ? activeColor : "rgba(255,255,255,0.5)";
      cursorCtx.fill();
      if (!pointing) { cursorCtx.lineWidth=2; cursorCtx.strokeStyle="#fff"; cursorCtx.stroke(); }

      if (pointing) {
        if (!state.isDrawing) {
          // بدء الرسم
          state.isDrawing = true;
          state.startX = tip.x;
          state.startY = tip.y;
          state.lastX = tip.x;
          state.lastY = tip.y;
        }

        if (currentTool === 'free') {
          // الرسم الحر
          drawCtx.beginPath();
          drawCtx.moveTo(state.lastX, state.lastY);
          drawCtx.lineTo(tip.x, tip.y);
          if (currentStyle === 'neon') {
            drawCtx.shadowColor = activeColor; drawCtx.shadowBlur = 15;
          } else { drawCtx.shadowBlur = 0; }
          drawCtx.strokeStyle = activeColor;
          drawCtx.lineWidth = activeSize;
          drawCtx.lineCap = "round"; drawCtx.lineJoin = "round";
          drawCtx.stroke();
          
          state.lastX = tip.x;
          state.lastY = tip.y;
        } else {
          // معاينة الشكل الهندسي على شاشة المؤشر
          renderShape(cursorCtx, currentTool, currentStyle, 
                     {x: state.startX, y: state.startY}, tip, activeColor, activeSize, true);
        }
      } else {
        // انتهى الرسم (تم إنزال الإصبع)
        if (state.isDrawing && currentTool !== 'free') {
           // تثبيت الشكل النهائي على شاشة الرسم الأساسية
           renderShape(drawCtx, currentTool, currentStyle, 
                      {x: state.startX, y: state.startY}, tip, activeColor, activeSize, false);
        }
        state.isDrawing = false;
      }
    });

    if (results.landmarks.length > 0) setStatus("تتبع اليد نشط", "tracking");
    else setStatus("ارفع يدك للكاميرا", "ready");

    requestAnimationFrame(runFrame);
  }

  init();
</script>
</body>
</html>
